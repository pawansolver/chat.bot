<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Image Generator</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Your CSS -->
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="container">

        <!-- Header -->
        <header class="header">
            <div class="logo-wrapper">
                <div class="logo">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <h1>AI Image Generator</h1>
            </div>

            <button class="theme-toggle">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>

        <!-- Main -->
        <div class="main-content">
            <form class="prompt-form">

                <!-- Prompt Input -->
                <div class="prompt-container">
                    <textarea class="prompt-input"
                              placeholder="Describe your imagination in detail..."
                              required></textarea>

                    <button type="button" class="prompt-btn">
                        <i class="fa-solid fa-dice"></i>
                    </button>
                </div>

                <!-- Options -->
                <div class="prompt-actions">

                    <!-- Model Select -->
                    <div class="select-wrapper">
                        <select class="custom-select" id="model-select">
                           <option value="black-forest-labs/FLUX.1-dev">FLUX.1-dev</option>
                           <option value="black-forest-labs/FLUX.1-schnell">FLUX.1-schnell</option>
                           <option value="stabilityai/stable-diffusion-xl-base-1.0">Stable Diffusion XL</option>
                           <option value="runwayml/stable-diffusion-v1-5">Stable Diffusion v1.5</option>
                        </select>
                    </div>

                    <!-- Image Count -->
                    <div class="select-wrapper">
                        <select class="custom-select" id="count-select">
                            <option value="1">1 Image</option>
                            <option value="2">2 Images</option>
                            <option value="3">3 Images</option>
                            <option value="4">4 Images</option>
                        </select>
                    </div>

                    <!-- Aspect Ratio -->
                    <div class="select-wrapper">
                        <select class="custom-select" id="ratio-select">
                            <option value="1/1">Square (1:1)</option>
                            <option value="16/9">Landscape (16:9)</option>
                            <option value="9/16">Portrait (9:16)</option>
                        </select>
                    </div>

                    <!-- Generate Button -->
                    <button type="submit" class="Generate-btn">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        Generate
                    </button>
                </div>

                <!-- Gallery -->
                <div class="gallery-grid"></div>

            </form>
        </div>
    </div>

    <!-- JS -->
    <script src="index.js"></script>
</body>
</html>
